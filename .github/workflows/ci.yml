name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore CSharpModernizer.sln

      - name: Build
        run: dotnet build CSharpModernizer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CSharpModernizer.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/coverage.cobertura.xml'

  cli-smoke-test:
    name: CLI Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install CLI tool
        run: |
          dotnet pack src/Analyzer.Cli/Analyzer.Cli.csproj -o ./nupkg
          dotnet tool install --global --add-source ./nupkg CSharpModernizer.Cli

      - name: Run scan
        run: pm-modernize scan src --full

      - name: Test SARIF output
        run: pm-modernize scan src --full --output sarif > /dev/null

      - name: Test rule filtering
        run: pm-modernize scan src --full --rule MOD008 --exclude-rule MOD001

      - name: Test MCP server handshake
        run: |
          printf 'Content-Length: 58\r\n\r\n{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | \
            timeout 5 pm-modernize mcp-serve 2>/dev/null | head -c 500 | grep -q "protocolVersion"
