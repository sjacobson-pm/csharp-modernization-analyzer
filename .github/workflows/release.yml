name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore CSharpModernizer.sln

      - name: Build
        run: dotnet build CSharpModernizer.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test CSharpModernizer.sln --configuration Release --no-build

      - name: Pack CLI tool
        run: dotnet pack src/Analyzer.Cli/Analyzer.Cli.csproj --configuration Release --no-build -o ./artifacts -p:Version=${{ steps.version.outputs.version }}

      - name: Push to NuGet (GitHub Packages)
        run: dotnet nuget push ./artifacts/*.nupkg --source "https://nuget.pkg.github.com/sjacobson-pm/index.json" --api-key ${{ secrets.GITHUB_TOKEN }}

      - name: Push to NuGet.org
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./artifacts/*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*.nupkg
          generate_release_notes: true
